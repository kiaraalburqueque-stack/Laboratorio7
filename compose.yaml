services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: securitydb
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-RootS07Local!2026}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/securitydb
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-RootS07Local!2026}
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
